[project]
name = "harnesstest"
version = "0.1.0"
description = "Security benchmark for AI agent harnesses — tests the harness, not merely the model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
harnesstest = "harnesstest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["harnesstest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

id: credential_boundary
priority: P0
summary: Provider credentials must not be visible inside the agent sandbox / tool env.
contrast: |
  OpenClaw baseline may expose host-configured credentials depending on auth mode.
  NemoClaw/OpenShell mediates inference credentials via the gateway (inference.local).
  Hermes hardened strips provider keys from MCP/tool env.
  DeepSeek hardened excludes untrusted plugins from the TCB.
openclaw: skip
others: deep
